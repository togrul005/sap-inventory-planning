<!doctype html>
<html><head><meta charset="utf-8">
<style> body { margin: 0; background: #fff; } svg text { font-family: "Helvetica Neue", Arial, sans-serif; } </style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#354a5f"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#256f3a"/></marker>
  </defs>
  <rect width="1600" height="860" fill="#fff"/>
  <text x="40" y="50" font-size="30" font-weight="700" fill="#1d2d3e">Business process – governed change of reorder point, safety stock and maximum stock</text>
  <text x="40" y="82" font-size="17" fill="#556b82">To-be process supported by the two SAP Fiori apps (status of a change: Submitted → Approved → Updated in S/4HANA, or Rejected / Withdrawn)</text>

  <!-- lanes -->
  <g font-size="17" font-weight="700" fill="#1d2d3e">
    <rect x="40" y="110" width="1520" height="170" fill="#f5f9ff" stroke="#c9d6e3"/>
    <rect x="40" y="280" width="1520" height="170" fill="#ffffff" stroke="#c9d6e3"/>
    <rect x="40" y="450" width="1520" height="190" fill="#f5f9ff" stroke="#c9d6e3"/>
    <rect x="40" y="640" width="1520" height="170" fill="#f3f9f1" stroke="#c9d6e3"/>
    <rect x="40" y="110" width="150" height="700" fill="#e4ecf5" stroke="#c9d6e3"/>
    <text x="115" y="185" text-anchor="middle">Inventory</text><text x="115" y="207" text-anchor="middle">planner</text>
    <text x="115" y="230" text-anchor="middle" font-size="13" font-weight="400" fill="#556b82">Cockpit app</text>
    <text x="115" y="355" text-anchor="middle">CAP service</text>
    <text x="115" y="378" text-anchor="middle" font-size="13" font-weight="400" fill="#556b82">on SAP BTP</text>
    <text x="115" y="530" text-anchor="middle">Planning</text><text x="115" y="552" text-anchor="middle">lead</text>
    <text x="115" y="575" text-anchor="middle" font-size="13" font-weight="400" fill="#556b82">Approvals app</text>
    <text x="115" y="715" text-anchor="middle">SAP</text><text x="115" y="738" text-anchor="middle">S/4HANA Cloud</text>
  </g>

  <!-- shapes -->
  <g font-size="14" fill="#1d2d3e" text-anchor="middle">
    <circle cx="235" cy="195" r="18" fill="#fff" stroke="#256f3a" stroke-width="3"/>
    <rect x="275" y="150" width="170" height="90" rx="12" fill="#fff" stroke="#0a6ed1" stroke-width="2"/>
    <text x="360" y="183" font-weight="700">1 Sync plant</text><text x="360" y="203">“Sync from</text><text x="360" y="221">S/4HANA”</text>

    <rect x="275" y="320" width="170" height="90" rx="12" fill="#fff" stroke="#354a5f" stroke-width="1.5"/>
    <text x="360" y="350" font-weight="700">2 Read and merge</text><text x="360" y="370">stock, MRP data,</text><text x="360" y="388">prices, goods issues</text>

    <rect x="490" y="320" width="190" height="90" rx="12" fill="#fff" stroke="#354a5f" stroke-width="1.5"/>
    <text x="585" y="345" font-weight="700">3 Calculate</text><text x="585" y="365">status, coverage,</text><text x="585" y="383">demand per day and</text><text x="585" y="401">suggested parameters</text>

    <rect x="490" y="150" width="190" height="90" rx="12" fill="#fff" stroke="#0a6ed1" stroke-width="2"/>
    <text x="585" y="178" font-weight="700">4 Analyse</text><text x="585" y="198">KPI tiles: Critical,</text><text x="585" y="216">Excess, To review …</text>

    <rect x="725" y="150" width="200" height="90" rx="12" fill="#fff" stroke="#0a6ed1" stroke-width="2"/>
    <text x="825" y="178" font-weight="700">5 Propose change</text><text x="825" y="198">current vs suggested,</text><text x="825" y="216">new values + reason</text>

    <rect x="725" y="320" width="200" height="90" rx="12" fill="#fff" stroke="#354a5f" stroke-width="1.5"/>
    <text x="825" y="345" font-weight="700">6 Validate and store</text><text x="825" y="365">one open change per</text><text x="825" y="383">material · PC-2026-…</text><text x="825" y="401">status Submitted</text>

    <rect x="725" y="500" width="200" height="90" rx="12" fill="#fff" stroke="#0a6ed1" stroke-width="2"/>
    <text x="825" y="528" font-weight="700">7 Review</text><text x="825" y="548">demand, formula,</text><text x="825" y="566">effect on status/value</text>

    <path d="M1010,500 L1060,545 L1010,590 L960,545 Z" fill="#fff" stroke="#354a5f" stroke-width="1.5"/>
    <text x="1010" y="550" font-weight="700">OK?</text>

    <rect x="1100" y="460" width="190" height="70" rx="12" fill="#fff" stroke="#0a6ed1" stroke-width="2"/>
    <text x="1195" y="490" font-weight="700">8a Approve</text><text x="1195" y="510">status Approved</text>

    <rect x="1100" y="560" width="190" height="70" rx="12" fill="#fff" stroke="#bb0000" stroke-width="2"/>
    <text x="1195" y="590" font-weight="700">8b Reject</text><text x="1195" y="610">reason required</text>

    <rect x="1330" y="460" width="190" height="70" rx="12" fill="#fff" stroke="#0a6ed1" stroke-width="2"/>
    <text x="1425" y="488" font-weight="700">9 Update in</text><text x="1425" y="508">S/4HANA</text>

    <rect x="1330" y="680" width="190" height="100" rx="12" fill="#fff" stroke="#256f3a" stroke-width="2"/>
    <text x="1425" y="706" font-weight="700">10 MRP data</text><text x="1425" y="726">A_ProductSupplyPlanning</text><text x="1425" y="744">PATCH (simulated in</text><text x="1425" y="762">the read-only sandbox)</text>

    <rect x="1330" y="320" width="190" height="90" rx="12" fill="#fff" stroke="#354a5f" stroke-width="1.5"/>
    <text x="1425" y="345" font-weight="700">11 Apply</text><text x="1425" y="365">new parameters in the</text><text x="1425" y="383">cockpit · status</text><text x="1425" y="401">Updated in S/4HANA</text>

    <circle cx="1322" cy="595" r="16" fill="#fff" stroke="#bb0000" stroke-width="4"/>
    <text x="1322" y="628" font-size="12" fill="#556b82">rejected</text>
    <circle cx="1490" cy="195" r="18" fill="#fff" stroke="#256f3a" stroke-width="4"/>
    <text x="1430" y="160" font-size="13" fill="#556b82">next sync shows the</text><text x="1430" y="176" font-size="13" fill="#556b82">new stock status</text>

    <rect x="275" y="680" width="660" height="100" rx="12" fill="#fff" stroke="#256f3a" stroke-width="1.5"/>
    <text x="605" y="708" font-weight="700">Material stock · product master (texts, MRP data, valuation) · material documents</text>
    <text x="605" y="732">API_MATERIAL_STOCK_SRV · API_PRODUCT_SRV · API_MATERIAL_DOCUMENT_SRV</text>
    <text x="605" y="756">OData V2, read through the destination S4HANA_SANDBOX</text>
  </g>

  <!-- flows -->
  <g stroke="#354a5f" stroke-width="2" fill="none">
    <line x1="253" y1="195" x2="271" y2="195" marker-end="url(#a)"/>
    <line x1="360" y1="240" x2="360" y2="316" marker-end="url(#a)"/>
    <line x1="360" y1="410" x2="360" y2="676" stroke="#256f3a" stroke-dasharray="6 4" marker-end="url(#g)"/>
    <line x1="445" y1="365" x2="486" y2="365" marker-end="url(#a)"/>
    <line x1="585" y1="320" x2="585" y2="244" marker-end="url(#a)"/>
    <line x1="680" y1="195" x2="721" y2="195" marker-end="url(#a)"/>
    <line x1="825" y1="240" x2="825" y2="316" marker-end="url(#a)"/>
    <line x1="825" y1="410" x2="825" y2="496" marker-end="url(#a)"/>
    <line x1="925" y1="545" x2="956" y2="545" marker-end="url(#a)"/>
    <polyline points="1010,500 1010,495 1096,495" marker-end="url(#a)"/>
    <polyline points="1010,590 1010,595 1096,595" marker-end="url(#a)"/>
    <line x1="1290" y1="495" x2="1326" y2="495" marker-end="url(#a)"/>
    <line x1="1425" y1="530" x2="1425" y2="676" stroke="#256f3a" marker-end="url(#g)"/>
    <polyline points="1520,730 1545,730 1545,365 1524,365" marker-end="url(#a)"/>
    <line x1="1425" y1="320" x2="1468" y2="211" marker-end="url(#a)"/>
    <line x1="1290" y1="595" x2="1302" y2="595" marker-end="url(#a)"/>
  </g>
  <g font-size="12.5" fill="#556b82">
    <text x="368" y="560">GET (paged, short URLs)</text>
    <text x="1032" y="488">yes</text><text x="1032" y="612">no</text>
    <text x="1433" y="610">PATCH +</text><text x="1433" y="626">CSRF token,</text><text x="1433" y="642">If-Match</text>
  </g>
</svg>
</body></html>
