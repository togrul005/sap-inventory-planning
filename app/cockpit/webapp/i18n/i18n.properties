infoTitle=How the cockpit suggests planning parameters
infoText=The cockpit reads the goods issues of the last 12 fiscal periods from SAP S/4HANA (API_MATERIAL_DOCUMENT_SRV) and calculates the average demand per day (d) and its variation (σ).\n\nSafety stock = 1.645 × σ × √(lead time)  (95 % service level)\nReorder point = d × lead time + safety stock\nMaximum stock = reorder point + 14 days of demand (at least the minimum lot size)\n\nWith fewer than 3 goods issues the variation is not reliable, so the safety stock is half of the lead-time demand.\n\nA material is flagged "To review" when its reorder point is 25 % or more away from the suggestion. Changes are approved by the planning lead and then written to the MRP data of the material (API_PRODUCT_SRV, A_ProductSupplyPlanning).
